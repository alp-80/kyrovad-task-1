services:
  database:
    image: postgres:15-alpine
    container_name: my_database
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: .
    container_name: my_backend
    restart: always
    depends_on:
      - database
    environment:
      DATABASE_URL: postgresql://postgres:secret@database:5432/mydb
    ports:
      - "8080:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata: